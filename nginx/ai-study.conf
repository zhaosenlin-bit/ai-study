# ai-study Nginx 反代配置
# 路径:ai-study/nginx/ai-study.conf(部署到 ai-study/nginx/)
# 创建:2026-09-04 小C

# ---- 前端 SPA 静态托管 ----
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # React SPA fallback(关键:刷新不报 404)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- 后端 API 反代(/api → ai-study-api:8000)----
    location /api/ {
        proxy_pass http://ai-study-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;  # LLM 调用慢
        proxy_buffering off;
    }

    # ---- LLM 代理(可选,生产建议走后端 services/agent 代理)----
    # location /llm-proxy/ {
    #     proxy_pass https://api.minimaxi.com/;
    #     proxy_set_header Host api.minimaxi.com;
    #     proxy_ssl_server_name on;
    # }

    charset utf-8;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
